[project]
name = "hill-scout"
version = "0.1.0"
description = "Daily loop that discovers public tabular datasets and builds them into Autolab hills"
requires-python = ">=3.11"
dependencies = ["openml>=0.15", "pandas>=2.2", "scikit-learn>=1.5", "numpy>=1.26", "pyyaml>=6", "pyarrow>=15"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
scout = "scout.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
